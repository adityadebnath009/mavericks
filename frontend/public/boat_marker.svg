<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Map pin background drop shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <!-- Pin body gradient -->
    <linearGradient id="pin-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B8389"/>
      <stop offset="100%" stop-color="#2C6872"/>
    </linearGradient>

    <!-- Hull gradient for depth -->
    <linearGradient id="hull-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24464D"/>
      <stop offset="100%" stop-color="#17303A"/>
    </linearGradient>

    <!-- Sail gradient -->
    <linearGradient id="sail-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Outer Map Pin Shape -->
  <path d="M256 32 C167.6 32 96 103.6 96 192 C96 304 256 480 256 480 C256 480 416 304 416 192 C416 103.6 344.4 32 256 32 Z" 
        fill="url(#pin-gradient)" 
        filter="url(#drop-shadow)"/>

  <!-- Inner white circular canvas inside the pin -->
  <circle cx="256" cy="184" r="112" fill="#FFFFFF" opacity="0.15"/>

  <!-- Boat Graphic Centered in Pin Head -->
  <g transform="translate(0, 8)">
    <!-- Water Waves -->
    <path d="M 180 248 Q 196 238, 212 248 T 244 248 T 276 248 T 308 248 T 340 248" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.8"/>
    
    <path d="M 196 262 Q 212 252, 228 262 T 260 262 T 292 262" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linecap="round" 
          opacity="0.5"/>

    <!-- Sailboat Hull -->
    <path d="M 176 220 L 336 220 C 336 220, 316 244, 256 244 C 196 244, 176 220, 176 220 Z" 
          fill="url(#hull-gradient)"/>

    <!-- Mast -->
    <rect x="251" y="112" width="10" height="110" rx="3" fill="#17303A"/>

    <!-- Main Sail -->
    <path d="M 265 116 C 310 130, 320 190, 320 210 C 290 210, 265 180, 265 116 Z" 
          fill="url(#sail-gradient)"/>

    <!-- Jib (Front Sail) -->
    <path d="M 241 124 C 210 150, 190 200, 184 212 C 205 212, 230 190, 241 124 Z" 
          fill="#F1F5F9" 
          opacity="0.9"/>
          
    <!-- Flag on Top -->
    <path d="M 251 104 L 275 114 L 251 124 Z" fill="#B34B3C"/>
  </g>

</svg>
