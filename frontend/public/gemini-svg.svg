<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Pin Gradient -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Water Ripples Gradient -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground Water Ripples (Marker Anchor Base) -->
  <ellipse cx="50" cy="112" rx="18" ry="4" fill="url(#waterGradient)"/>
  <ellipse cx="50" cy="112" rx="10" ry="2.5" fill="url(#waterGradient)"/>

  <!-- Map Pin Body -->
  <path d="M 50 10 
           C 25 10, 10 28, 10 52 
           C 10 76, 38 102, 50 112 
           C 62 102, 90 76, 90 52 
           C 90 28, 75 10, 50 10 Z" 
        fill="url(#pinGradient)" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        filter="url(#shadow)"/>

  <!-- Inner Circle Badge -->
  <circle cx="50" cy="48" r="30" fill="#FFFFFF"/>

  <!-- Sailboat Icon -->
  <g transform="translate(0, 2)">
    <!-- Main Sail -->
    <path d="M 48 26 L 48 53 L 67 53 C 67 53, 68 37, 48 26 Z" fill="#0284C7"/>
    
    <!-- Front/Jib Sail -->
    <path d="M 44 31 L 44 53 L 33 53 C 33 53, 35 40, 44 31 Z" fill="#38BDF8"/>
    
    <!-- Mast -->
    <line x1="46" y1="24" x2="46" y2="55" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hull -->
    <path d="M 28 57 L 72 57 L 65 67 C 60 70, 40 70, 35 67 Z" fill="#0F172A"/>

    <!-- Water Waves under Boat -->
    <path d="M 25 68 Q 30 66, 35 68 T 45 68 T 55 68 T 65 68 T 75 68" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="2" 
          stroke-linecap="round"/>
  </g>
</svg>
